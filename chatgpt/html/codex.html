<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/codex.css">
    <link rel="icon" href="../images/Codex 1.png">
    <title>ChatGPT</title>
</head>
<body>
    <header>
        <div id="codex_logo">
            <p>Codex</p>
        </div>
        <div id="setting">
            <ul>
                <li>코딩</li>
                <li>앱</li>
                <li>DOCS</li>
                <div></div>
            </ul>
        </div>
    </header>
        
    <main>
        <section id="codex">
            <h2>Codex를 시작할 방식 선택하기</h2>
            <p>Codex가 IDE, CLI, GitHub, 웹에 내장됩니다. 로컬에서 나란히 작업할 수도, 클라우드에서 돌아가도록 둘 수도 있습니다.</p>
        </section>
        <section class="box">
            <div id="box_x">
                <div id="box_x_img"></div>
                <a>CLI 설치</a>
            </div>
            <div id="box_y">
                <div id="box_y_img"></div>
                <a>앱 다운로드</a>
            </div>
            <div id="box_z">
                <div id="box_z_img"></div>
                <a>IDE 확장 프로그램 사용해보기</a>
            </div>
        </section>
        <section id="github">
            <div id="github_box">
                <h2><a href="https://github.com" target="_blank">GITHUB 연결하기</a></h2>
            </div>
        </section>
    </main>
</body>
</html>
